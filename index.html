<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="data/Provinces_3.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: '#ffff00',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: '#ffff00',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[40.611288470509045,-10.709427821782835],[56.43173280438284,23.298203247474436]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OpenStreetMap_0;
        map.addLayer(layer_OpenStreetMap_0);
        map.createPane('pane_provinces_modified_1');
        map.getPane('pane_provinces_modified_1').style.zIndex = 401;
        var img_provinces_modified_1 = 'data/provinces_modified_1.png';
        var img_bounds_provinces_modified_1 = [[-41.20630734730847,-180.0],[64.7,179.99695167096212]];
        var layer_provinces_modified_1 = new L.imageOverlay(img_provinces_modified_1,
                                              img_bounds_provinces_modified_1,
                                              {pane: 'pane_provinces_modified_1'});
        bounds_group.addLayer(layer_provinces_modified_1);
        map.addLayer(layer_provinces_modified_1);
        map.createPane('pane_heightmap_modified_2');
        map.getPane('pane_heightmap_modified_2').style.zIndex = 402;
        var img_heightmap_modified_2 = 'data/heightmap_modified_2.png';
        var img_bounds_heightmap_modified_2 = [[-41.20630734730847,-180.0],[64.7,179.99695167096212]];
        var layer_heightmap_modified_2 = new L.imageOverlay(img_heightmap_modified_2,
                                              img_bounds_heightmap_modified_2,
                                              {pane: 'pane_heightmap_modified_2'});
        bounds_group.addLayer(layer_heightmap_modified_2);
        map.addLayer(layer_heightmap_modified_2);
        function pop_Provinces_3(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">province_id</th>\
                        <td class="visible-with-data" id="province_id">' + (feature.properties['province_id'] !== null ? autolinker.link(String(feature.properties['province_id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">province_name</th>\
                        <td class="visible-with-data" id="province_name">' + (feature.properties['province_name'] !== null ? autolinker.link(String(feature.properties['province_name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">id_area</th>\
                        <td>' + (feature.properties['id_area'] !== null ? autolinker.link(String(feature.properties['id_area']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">id_provincegroup</th>\
                        <td>' + (feature.properties['id_provincegroup'] !== null ? autolinker.link(String(feature.properties['id_provincegroup']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">id_region</th>\
                        <td>' + (feature.properties['id_region'] !== null ? autolinker.link(String(feature.properties['id_region']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">id_superregion</th>\
                        <td>' + (feature.properties['id_superregion'] !== null ? autolinker.link(String(feature.properties['id_superregion']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">terrain_type</th>\
                        <td class="visible-with-data" id="terrain_type">' + (feature.properties['terrain_type'] !== null ? autolinker.link(String(feature.properties['terrain_type']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">climate</th>\
                        <td class="visible-with-data" id="climate">' + (feature.properties['climate'] !== null ? autolinker.link(String(feature.properties['climate']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">season</th>\
                        <td class="visible-with-data" id="season">' + (feature.properties['season'] !== null ? autolinker.link(String(feature.properties['season']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">terrain</th>\
                        <td class="visible-with-data" id="terrain">' + (feature.properties['terrain'] !== null ? autolinker.link(String(feature.properties['terrain']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Provinces_3_0() {
            return {
                pane: 'pane_Provinces_3',
                opacity: 1,
                color: 'rgba(35,35,35,0.34509803921568627)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1, 
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Provinces_3');
        map.getPane('pane_Provinces_3').style.zIndex = 403;
        map.getPane('pane_Provinces_3').style['mix-blend-mode'] = 'normal';
        var layer_Provinces_3 = new L.geoJson(json_Provinces_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Provinces_3',
            layerName: 'layer_Provinces_3',
            pane: 'pane_Provinces_3',
            onEachFeature: pop_Provinces_3,
            style: style_Provinces_3_0,
        });
        bounds_group.addLayer(layer_Provinces_3);
        map.addLayer(layer_Provinces_3);
        var overlaysTree = [
            {label: '<img src="legend/Provinces_3.png" /> Provinces', layer: layer_Provinces_3},
            {label: "heightmap_modified", layer: layer_heightmap_modified_2},
            {label: "provinces_modified", layer: layer_provinces_modified_1},
            {label: "OpenStreetMap", layer: layer_OpenStreetMap_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false, 
        });
        lay.addTo(map);
		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        resetLabels([layer_Provinces_3]);
        map.on("zoomend", function(){
            resetLabels([layer_Provinces_3]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Provinces_3]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Provinces_3]);
        });
        </script>
    </body>
</html>
